name: Marketplace registry projection

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-registry-projection
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Queue registry projection
        uses: actions/github-script@v8
        env:
          OFFSITE_URL: ${{ vars.DINOTTY_OFFSITE_URL }}
          OIDC_AUDIENCE: ${{ vars.DINOTTY_OIDC_AUDIENCE || 'dinotty-offsite' }}
        with:
          script: |
            if (!process.env.OFFSITE_URL) throw new Error('DINOTTY_OFFSITE_URL repository variable is required');
            const base = process.env.OFFSITE_URL.replace(/\/$/, '');
            const token = await core.getIDToken(process.env.OIDC_AUDIENCE);
            const response = await fetch(`${base}/api/internal/github/registry-projections`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({}),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error?.message || body.errorCode || JSON.stringify(body));
            if (!body.jobId) throw new Error(`registry projection did not return a job id: ${JSON.stringify(body)}`);
            for (let attempt = 0; attempt < 120; attempt += 1) {
              const statusToken = await core.getIDToken(process.env.OIDC_AUDIENCE);
              const statusResponse = await fetch(`${base}/api/internal/github/jobs/${body.jobId}`, {
                headers: { Authorization: `Bearer ${statusToken}` },
              });
              const status = await statusResponse.json().catch(() => ({}));
              if (!statusResponse.ok) throw new Error(status.error?.message || status.errorCode || JSON.stringify(status));
              if (['completed', 'superseded'].includes(status.status)) return;
              if (status.status === 'failed') throw new Error(`registry projection failed: ${status.errorCode || 'unknown'}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('registry projection timed out');
